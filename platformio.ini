; PlatformIO Project Configuration File
;
; BCA182 Room Monitoring System
; STM32 Blue Pill + FreeRTOS + STM32Cube HAL

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; Build flags for STM32 and FreeRTOS
build_flags = 
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -DHSE_VALUE=8000000
    -Isrc
    -Isrc/app/hal
    -Isrc/app/tasks
    -Isrc/app/logic

; Upload settings
upload_protocol = stlink
upload_port = swd

; Monitor settings
monitor_speed = 115200

; Unit testing
test_framework = unity
test_port = /dev/ttyUSB0

; FreeRTOS configuration
board_build.stm32cube.custom_config_header = yes
