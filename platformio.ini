; PlatformIO Project Configuration File
;
; BCA182 Room Monitoring System
; STM32 Blue Pill + FreeRTOS + STM32Cube HAL

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; Build flags for STM32
build_flags = 
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -DHSE_VALUE=8000000
    -Isrc
    -Isrc/app
    -Isrc/app/hal
    -Isrc/app/tasks
    -Isrc/app/logic
    -Iinclude

; FreeRTOS library
lib_deps =
    bojit/PlatformIO-FreeRTOS@^2.1.4

; Upload settings
upload_protocol = stlink
upload_port = swd

; Monitor settings
monitor_speed = 115200

; Unit testing
test_framework = unity
test_port = /dev/ttyUSB0
