; PlatformIO Project Configuration File
;
; BCA182 Room Monitoring System
; STM32 Blue Pill + FreeRTOS + STM32Cube HAL

[env]
test_framework = unity

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; Prints a warning if the Wokwi port workaround did not make it into the image.
extra_scripts = post:tools/verify/check_port_patch.py

; The default `chain` mode only builds a library if some project source
; #includes one of its headers.  Nothing includes anything from
; freertos_port_patch -- it exists purely to shadow the FreeRTOS archive's own
; ARM_CM3 port.o -- so under `chain` it is never compiled and the linker
; silently falls back to the unpatched port.  The trailing `+` keeps the
; normal dependency scan and additionally builds every library in lib/.
lib_ldf_mode = deep+

; Build flags for STM32
;
; The newlib-nano that PlatformIO links by default ships two printf variants
; and picks the integer-only one, because the linker only pulls in the float
; formatter when something references it.  Nothing in this project does, so
; "%.1f" was being routed to _svfprintf_r, which has no conversion for 'f'.
; The consequence was quiet rather than loud: the literal conversion text came
; through in place of the number.  -u forces the float helper into the image.
; Measured cost is a little under 3 KB of the 26 KB still free in flash.
build_flags = 
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -DHSE_VALUE=8000000
    -Isrc
    -Isrc/app
    -Isrc/app/hal
    -Isrc/app/tasks
    -Isrc/app/logic
    -Iinclude
    -Isrc/drivers
    -Wl,-u,_printf_float

; FreeRTOS library.  `freertos_port_patch` shadows the FreeRTOS archive's own
; ARM_CM3 port.o with a project-local copy that carries a Wokwi workaround; see
; lib/freertos_port_patch/src/port.c for the full explanation.
;
; The patch library is named here as a local path, not as a registry package.
; It has to be named at all because the Library Dependency Finder only builds a
; library that some project source #includes, and nothing includes anything from
; this one -- it exists purely to shadow the FreeRTOS archive's port.o.  Left to
; the LDF it is never compiled and the linker silently falls back to the
; unpatched port.  A bare `freertos_port_patch` entry is wrong: PlatformIO reads
; that as a registry package, tries to fetch it, fails, and aborts the build
; before the link step.  The `file://` prefix is what marks it as local.
lib_deps =
    bojit/PlatformIO-FreeRTOS@^2.1.4
    file://lib/freertos_port_patch

; Upload settings
upload_protocol = stlink
upload_port = swd

; Monitor settings
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
; The patched port is Cortex-M3 assembly and must never be compiled for the host.
lib_ignore = freertos_port_patch
